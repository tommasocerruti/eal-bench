policy: Any order to an events vendor outside the approved events framework requires an active exception
  issued by the chief financial officer. It applies to the named grantee, purchase action, vendor, service
  categories and currency. Orders must be no greater than its stated amount and placed at or after its
  start time but before its end time. A later signed CFO amendment takes effect as dated and changes the
  fields it names.
authorized_issuers:
- chief_financial_officer
