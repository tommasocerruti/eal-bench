policy: Any purchase from a software vendor whose current security review is incomplete requires an active
  exception issued by the chief financial officer. It applies to the named grantee, purchase action, vendor,
  categories and currency. Orders must be no greater than its stated amount and placed at or after its
  start time but before its end time.
authorized_issuers:
- chief_financial_officer
