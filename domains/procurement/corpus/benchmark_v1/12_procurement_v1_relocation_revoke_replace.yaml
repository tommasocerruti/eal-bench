policy: Any order to a relocation contractor outside the approved relocation panel requires an active
  exception issued by the chief financial officer. It applies to the named grantee, purchase action, contractor,
  service categories and currency. Orders must be no greater than its stated amount and placed at or after
  its start time but before its end time. A CFO revocation stops the named exception at the stated time;
  a replacement applies under its own terms.
authorized_issuers:
- chief_financial_officer
