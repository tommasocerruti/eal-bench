policy: Any purchase from a laboratory supplier without current accreditation requires an active exception
  issued by the chief financial officer. It applies to the named grantee, purchase action, supplier, categories
  and currency. Orders must be no greater than its stated amount and placed at or after its start time
  but before its end time. A later signed CFO amendment takes effect at the time written in it.
authorized_issuers:
- chief_financial_officer
