policy: Any purchase from an HVAC contractor that has not completed the approved-contractor qualification
  requires an active exception issued by the chief financial officer. It applies to the named grantee,
  purchase action, contractor, categories and currency. Orders must be no greater than its stated amount
  and placed at or after its start time but before its end time.
