policy: Any order to a commercial print house outside the approved marketing services framework requires
  an active exception issued by the chief financial officer. It applies to the named grantee, purchase
  action, vendor, categories and currency. Orders must be no greater than its stated amount and placed
  at or after its start time but before its end time. A CFO revocation stops the named exception at the
  stated time; a replacement applies under its own terms.
