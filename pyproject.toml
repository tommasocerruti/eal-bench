[project]
name = "eal-bench"
version = "0.1.0"
description = "Endogenous Authorization Laundering Benchmark."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "aiolimiter>=1.1",
    "tiktoken>=0.7",
    "langchain-core>=1.2,<2",
    "langchain-openai>=0.3.1,<2",
    "langchain-openrouter>=0.2.5,<1",
    "langmem==0.0.30",
    "jsonpatch>=1.33,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]
analysis = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eal_bench"]

[tool.ruff]
line-length = 100
src = ["src", "examples", "domains", "experiments", "analysis"]
